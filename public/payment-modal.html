<!-- Payment Modal Component -->
<div id="paymentModal" class="payment-modal" style="display: none;">
  <div class="payment-modal-content">
    <div class="payment-modal-header">
      <h2>Select Payment Method</h2>
      <button class="close-payment-modal" onclick="closePaymentModal()">&times;</button>
    </div>

    <div class="payment-modal-body">
      <!-- Payment Amount Display -->
      <div class="payment-amount-box">
        <p class="label">Total Amount</p>
        <p class="amount">₹<span id="paymentAmount">0</span></p>
      </div>

      <!-- Payment Methods -->
      <div class="payment-methods">
        <!-- UPI Section -->
        <div class="payment-section">
          <h3 class="section-title">💳 UPI Payment</h3>
          <div class="payment-grid">
            <button class="payment-btn upi-btn" onclick="selectUPI()">
              <div class="payment-icon">📱</div>
              <span>UPI</span>
              <small>Direct Transfer</small>
            </button>
          </div>

          <!-- UPI Input -->
          <div id="upiForm" style="display: none; margin-top: 20px;">
            <input type="text" id="upiId" placeholder="Enter your UPI ID (e.g., name@upi)" class="input-field">
            <div id="upiAppsList" style="margin-top: 15px;">
              <p style="font-size: 12px; color: #888; margin-bottom: 10px;">Available UPI Apps:</p>
              <div class="upi-apps-grid">
                <button class="upi-app-btn" onclick="redirectToUPIApp('phonepe')">
                  <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%235002DC'/%3E%3Ctext x='50' y='60' text-anchor='middle' font-size='30' fill='white' font-weight='bold'%3EPP%3C/text%3E%3C/svg%3E" alt="PhonePe" class="upi-app-icon">
                  <span>PhonePe</span>
                </button>
                <button class="upi-app-btn" onclick="redirectToUPIApp('googlepay')">
                  <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%234285F4'/%3E%3Ctext x='50' y='60' text-anchor='middle' font-size='20' fill='white' font-weight='bold'%3EGPay%3C/text%3E%3C/svg%3E" alt="Google Pay" class="upi-app-icon">
                  <span>Google Pay</span>
                </button>
                <button class="upi-app-btn" onclick="redirectToUPIApp('paytm')">
                  <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230066FF'/%3E%3Ctext x='50' y='60' text-anchor='middle' font-size='18' fill='white' font-weight='bold'%3EPayTM%3C/text%3E%3C/svg%3E" alt="PayTM" class="upi-app-icon">
                  <span>PayTM</span>
                </button>
                <button class="upi-app-btn" onclick="redirectToUPIApp('whatsapp')">
                  <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%2325D366'/%3E%3Ctext x='50' y='60' text-anchor='middle' font-size='25' fill='white' font-weight='bold'%3EW%3C/text%3E%3C/svg%3E" alt="WhatsApp" class="upi-app-icon">
                  <span>WhatsApp</span>
                </button>
              </div>
            </div>
            <button class="btn-submit" onclick="initiateUPIPayment()">Proceed with UPI</button>
          </div>
        </div>

        <!-- Digital Wallets Section -->
        <div class="payment-section">
          <h3 class="section-title">🎯 Digital Wallets</h3>
          <div class="payment-grid">
            <button class="payment-btn phonepe-btn" onclick="initiatePhonePePayment()">
              <div class="payment-icon">📱</div>
              <span>PhonePe</span>
              <small>Fast & Secure</small>
            </button>
            <button class="payment-btn googlepay-btn" onclick="initiateGooglePayPayment()">
              <div class="payment-icon">💰</div>
              <span>Google Pay</span>
              <small>Instant Transfer</small>
            </button>
            <button class="payment-btn paytm-btn" onclick="initiatePayTMPayment()">
              <div class="payment-icon">💳</div>
              <span>PayTM</span>
              <small>Popular Wallet</small>
            </button>
          </div>
        </div>

        <!-- Bank Transfer Section -->
        <div class="payment-section">
          <h3 class="section-title">🏦 Bank Transfer</h3>
          <div class="payment-grid">
            <button class="payment-btn netbanking-btn" onclick="initiateNetBanking()">
              <div class="payment-icon">🏦</div>
              <span>Net Banking</span>
              <small>All Banks</small>
            </button>
          </div>
        </div>
      </div>

      <!-- Payment Info -->
      <div class="payment-info">
        <p>✅ Your payment is secure and encrypted</p>
        <p>✅ Direct transfer to farmer's account</p>
        <p>✅ Transaction reference will be provided</p>
      </div>
    </div>
  </div>
</div>
