<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmer Orders | AgriConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* 🌿 Page Base */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      color: #2f2f2f;
      overflow-x: hidden;
      background: linear-gradient(120deg, #e3f2d3, #fef9e7, #d1f7e3);
      background-size: 400% 400%;
      animation: gradientShift 20s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ✨ Floating particles */
    .particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      width: 8px;
      height: 8px;
      animation: float 10s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(0) scale(1); opacity: 0.8; }
      50% { transform: translateY(-100vh) scale(1.2); opacity: 0.3; }
      100% { transform: translateY(0) scale(1); opacity: 0.8; }
    }

    /* 🌾 Header */
    header {
      background: linear-gradient(90deg, #6b4226, #a67744);
      color: #fff;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 5;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
      animation: slideDown 1s ease-in-out;
    }

    header h1 {
      font-size: 24px;
      margin: 0;
      letter-spacing: 1px;
    }

    header button {
      background: linear-gradient(90deg, #a3c14a, #8bb03f);
      border: none;
      padding: 8px 18px;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    header button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(163, 193, 74, 0.4);
    }

    @keyframes slideDown {
      from { transform: translateY(-50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* 🌾 Main Section */
    main {
      padding: 40px 25px;
      position: relative;
      z-index: 2;
      animation: fadeIn 1.5s ease;
    }

    main h2 {
      text-align: center;
      font-size: 26px;
      color: #5a3d1e;
      margin-bottom: 25px;
      position: relative;
    }

    main h2::after {
      content: "";
      display: block;
      width: 60px;
      height: 4px;
      background: #a3c14a;
      margin: 10px auto 0;
      border-radius: 2px;
    }

    /* 🌾 Grid Layout for Orders */
.orders-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 25px;
  margin-top: 25px;
}


    .order-card {
  background: rgba(255,255,255,0.95);
  border: 2px solid #d9e7c7;
  border-radius: 14px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.08);
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  position: relative;
  overflow: hidden;
  text-align: center;
}

.order-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.12);
}

.order-card img {
  width: 100%;
  height: 160px;
  border-radius: 10px;
  object-fit: cover;
  margin-bottom: 10px;
}

.order-info {
  flex: 1;
}

.order-info h3 {
  color: #6b4226;
  margin-bottom: 6px;
}

.order-actions {
  display: flex;
  justify-content: space-around;
  margin-top: 12px;
}


    .order-actions button {
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .confirm-btn {
      background: linear-gradient(90deg, #4CAF50, #2e7d32);
      color: #fff;
    }

    .cancel-btn {
      background: linear-gradient(90deg, #e57373, #c62828);
      color: #fff;
    }

    .confirm-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
    }

    .cancel-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 10px rgba(198, 40, 40, 0.3);
    }

    .order-actions button:disabled {
      background: #bbb;
      cursor: not-allowed;
      box-shadow: none;
    }

    .price-tag {
      font-weight: bold;
      color: #2e7d32;
    }

    .no-orders {
      text-align: center;
      margin-top: 40px;
      color: #666;
      font-style: italic;
      font-size: 16px;
    }

    small {
      color: #777;
    }

    /* 🔆 Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 🌿 Shimmer Loading */
    .loading {
      background: linear-gradient(100deg, #f0f0f0 30%, #e0e0e0 50%, #f0f0f0 70%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    /* 💬 Chat Button Styles */
    .chat-btn {
      background: linear-gradient(90deg, #1E8562, #4ABDAC);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
      font-size: 14px;
    }

    .chat-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(30, 133, 98, 0.4);
    }

    .chat-btn:active {
      transform: translateY(0);
    }
  </style>
</head>

<body>
  <!-- ✨ Floating particles -->
  <script>
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.classList.add('particle');
      p.style.left = Math.random() * 100 + 'vw';
      p.style.top = Math.random() * 100 + 'vh';
      p.style.animationDelay = Math.random() * 8 + 's';
      document.body.appendChild(p);
    }
  </script>

  <header>
    <h1>📦 Received Orders</h1>
    <button onclick="window.location.href='farmers.html'">⬅ Back to Dashboard</button>
  </header>

  <main>
    <h2>Your Latest Orders</h2>
    <div class="orders-container" id="ordersContainer">
      <p class="no-orders loading">Loading orders...</p>
    </div>
  </main>

  <script>
    async function fetchOrders() {
      const container = document.getElementById('ordersContainer');
      try {
        const res = await fetch("https://agriconnect-y.onrender.com/api/farmer/orders", {
          method: "GET",
          credentials: "include"
        });
        const data = await res.json();
        container.innerHTML = "";

        const orders = data.orders || data;
        if (!Array.isArray(orders) || orders.length === 0) {
          container.innerHTML = `<p class="no-orders">No orders received yet.</p>`;
          return;
        }

        orders.forEach((order, index) => {
          const orderId = order._id || order.id;
          const card = document.createElement("div");
          card.className = "order-card";
          card.style.animationDelay = `${index * 0.15}s`; // 👈 Smooth stagger animation

          card.innerHTML = `
            <div class="order-info">
              <h3>${order.productName || "Unnamed Product"}</h3>
              <p><strong>Buyer:</strong> ${order.buyerName || "Unknown Buyer"}</p>
              <p><strong>Email:</strong> ${order.buyerEmail || "Not Provided"}</p>
              <p><strong>Phone:</strong> ${order.buyerPhone || "Not Provided"}</p>
              <p><strong>Address:</strong> ${order.buyerAddress || "Not Provided"}</p>
              <p><strong>Quantity:</strong> ${order.quantity || 1}</p>
              <p><strong>Payment Mode:</strong> ${order.paymentMode || "N/A"}</p>
              <p class="price-tag">💰 Price: ₹${order.price || order.productPrice || 0}</p>
              <p><small>🕒 ${new Date(order.date || order.createdAt).toLocaleString()}</small></p>
              <p><strong>Status:</strong> <span id="status-${orderId}">${order.status}</span></p>
            </div>
            <div class="order-actions">
              <button class="chat-btn" onclick="openFarmerChat(event, '${order.buyerName}', '${order.productName}')">
                💬 Chat with Buyer
              </button>
              <button class="confirm-btn" ${order.status === "Confirmed" ? "disabled" : ""}>
                ${order.status === "Confirmed" ? "✅ Confirmed" : "✅ Mark as Received"}
              </button>
              <button class="cancel-btn" ${order.status === "Cancelled" ? "disabled" : ""}>
                ${order.status === "Cancelled" ? "❌ Cancelled" : "❌ Cancel Order"}
              </button>
            </div>
          `;

          const confirmBtn = card.querySelector(".confirm-btn");
          confirmBtn.addEventListener("click", async () => {
            confirmBtn.disabled = true;
            confirmBtn.textContent = "✅ Confirmed";
            document.getElementById(`status-${orderId}`).textContent = "Confirmed";
            try {
              const response = await fetch(`https://agriconnect-y.onrender.com/api/orders/${orderId}/status`, {
                method: "PUT",
                credentials: "include",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status: "Confirmed" })
              });
              const result = await response.json();
              if (!result.success) alert("⚠️ Failed to update status on server.");
              else alert(`🎉 Order for "${order.productName}" marked as confirmed!`);
            } catch (e) {
              console.error("Error updating order:", e);
            }
          });

          const cancelBtn = card.querySelector(".cancel-btn");
          cancelBtn.addEventListener("click", async () => {
            if (!confirm("⚠️ Are you sure you want to cancel this order?")) return;
            cancelBtn.disabled = true;
            cancelBtn.textContent = "❌ Cancelled";
            document.getElementById(`status-${orderId}`).textContent = "Cancelled";
            try {
              const response = await fetch(`http://localhost:5000/api/orders/${orderId}/status`, {
                method: "PUT",
                credentials: "include",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status: "Cancelled" })
              });
              const result = await response.json();
              if (!result.success) alert("⚠️ Failed to update status.");
              else alert(`🚫 Order for "${order.productName}" cancelled.`);
            } catch (e) {
              console.error("Error cancelling order:", e);
            }
          });

          container.appendChild(card);
        });
      } catch (err) {
        console.error("Error fetching orders:", err);
        container.innerHTML = `<p class="no-orders">⚠️ Failed to load orders.</p>`;
      }
    }
    window.onload = fetchOrders;
  </script>

  <!-- 💬 CHAT MODAL -->
  <div id="chatModal" style="display:none; position:absolute; width:320px; max-width:90%; z-index:1000;">
    <div style="background:white; border-radius:12px; width:90%; max-width:600px; height:600px; display:flex; flex-direction:column; box-shadow:0 10px 40px rgba(0,0,0,0.3);">
      <!-- Header -->
      <div style="background:#1E8562; color:white; padding:20px; border-radius:12px 12px 0 0; display:flex; justify-content:space-between; align-items:center;">
        <div>
          <h3 id="chatTitle" style="margin:0; font-size:18px;">Chat with Buyer</h3>
          <small id="productLabel" style="opacity:0.9;">Product: -</small>
        </div>
        <button onclick="closeFarmerChat()" style="background:none; border:none; font-size:24px; cursor:pointer; color:white;">✕</button>
      </div>

      <!-- Messages -->
      <div id="chatMessages" style="flex:1; overflow-y:auto; padding:20px; background:#f9f9f9;">
        <p style="text-align:center; color:#999;">Loading messages...</p>
      </div>

      <!-- Input -->
      <div style="padding:15px; border-top:1px solid #ddd; display:flex; gap:10px;">
        <input id="chatInput" type="text" placeholder="Type message..." style="flex:1; padding:10px; border:1px solid #ddd; border-radius:6px; font-family:'Poppins', sans-serif;">
        <button onclick="sendFarmerChatMessage()" style="background:#4ABDAC; color:white; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; font-weight:600;">Send</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const socket = io("https://agriconnect-y.onrender.com", { withCredentials: true });
    let currentChatUser = "";
    let currentProductName = "";
    let myUsername = "";

    // Get current user
    fetch("${API_URL}/api/me", { credentials: "include" })
      .then(res => res.json())
      .then(user => {
        myUsername = user.username;
        socket.emit("register", user);
      })
      .catch(err => console.error("Failed to get user:", err));

    function openFarmerChat(evt, buyerName, productName) {
      const modal = document.getElementById("chatModal");
      currentChatUser = buyerName;
      currentProductName = productName;
      document.getElementById("chatTitle").textContent = `Chat with ${buyerName}`;
      document.getElementById("productLabel").textContent = `Product: ${productName}`;
      document.getElementById("chatInput").value = "";

      // position modal near button
      if (evt && evt.target) {
        const rect = evt.target.getBoundingClientRect();
        let topPos = window.scrollY + rect.bottom + 8;
        let leftPos = window.scrollX + rect.left;
        const modalWidth = modal.offsetWidth || 320;
        const maxLeft = window.scrollX + window.innerWidth - modalWidth - 10;
        if (leftPos > maxLeft) leftPos = maxLeft;
        modal.style.top = topPos + "px";
        modal.style.left = leftPos + "px";
      }
      modal.style.display = "block";

      loadFarmerChatMessages();
    }

    function closeFarmerChat() {
      document.getElementById("chatModal").style.display = "none";
      currentChatUser = "";
    }

    async function loadFarmerChatMessages() {
      try {
        const res = await fetch(`/api/chat/${currentChatUser}`, {
          credentials: "include"
        });

        if (!res.ok) {
          console.error("Failed to load messages:", res.status);
          return;
        }

        const messages = await res.json();
        const messagesDiv = document.getElementById("chatMessages");
        messagesDiv.innerHTML = "";

        if (messages.length === 0) {
          messagesDiv.innerHTML = "<p style='text-align:center; color:#999;'>No messages yet. Buyer will message you first!</p>";
        } else {
          messages.forEach(msg => {
            const isMe = msg.from === myUsername;
            const msgDiv = document.createElement("div");
            msgDiv.style.marginBottom = "12px";
            msgDiv.style.textAlign = isMe ? "right" : "left";
            msgDiv.innerHTML = `
              <div style="background:${isMe ? "#4ABDAC" : "#e0e0e0"}; color:${isMe ? "white" : "#333"}; padding:10px 15px; border-radius:12px; display:inline-block; max-width:70%; word-wrap:break-word;">
                <strong style="font-size:12px; opacity:0.8;">${msg.from}</strong><br>
                ${msg.message}
                <br><small style="opacity:0.7; font-size:11px;">${new Date(msg.createdAt).toLocaleTimeString()}</small>
              </div>
            `;
            messagesDiv.appendChild(msgDiv);
          });
        }

        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      } catch (err) {
        console.error("Error loading messages:", err);
        document.getElementById("chatMessages").innerHTML = "<p style='color:red;'>Error loading messages</p>";
      }
    }

    function sendFarmerChatMessage() {
      const message = document.getElementById("chatInput").value.trim();
      if (!message || !currentChatUser) return;

      socket.emit("sendMessage", {
        from: myUsername,
        to: currentChatUser,
        message: message
      });

      document.getElementById("chatInput").value = "";
      
      // Refresh messages
      setTimeout(() => loadFarmerChatMessages(), 500);
    }

    // Listen for incoming messages
    socket.on("receiveMessage", ({ from, message }) => {
      if (from === currentChatUser && document.getElementById("chatModal").style.display === "flex") {
        loadFarmerChatMessages();
      }
    });

    // Allow Enter key to send message
    document.addEventListener("keypress", (e) => {
      if (e.key === "Enter" && document.getElementById("chatModal").style.display === "block") {
        sendFarmerChatMessage();
      }
    });

    // clicking outside closes the chat modal
    document.addEventListener('click', e => {
      const modal = document.getElementById('chatModal');
      if (modal.style.display === 'block') {
        if (!modal.contains(e.target) && !e.target.classList.contains('chat-btn')) {
          modal.style.display = 'none';
        }
      }
    });
  </script>
</body>
</html>
