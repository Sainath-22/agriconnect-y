<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Profile | Green Fields</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* SAME PALETTE AS consumers.html */
      --primary: #1E8562;       /* Green */
      --secondary: #4ABDAC;     /* Aqua green */
      --accent: #f0f9f5;        /* Light mint */
      --surface: #ffffff;       /* Cards */
      --highlight: #4ABDAC;     /* Accent same as secondary */
      --text: #1b3a2f;
      --radius: 12px;
      --shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
    }

    /* ======================================
       MATCHING BACKGROUND OF consumers.html
       ====================================== */
    body {
      min-height: 100vh;
      display: flex;
      color: var(--text);

      background: linear-gradient(135deg,
          #e0f7ef,
          #c8ffe0,
          #b3f5d0,
          #8fe9c0);
      background-size: 400% 400%;
      animation: gradientMove 12s ease infinite;
      transition: 0.3s;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* SIDEBAR — UPDATED TO MATCH consumers.html */
    aside.sidebar {
      width: 250px;
      background: var(--primary);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    aside.sidebar h2 {
      font-size: 1.6em;
      margin-bottom: 24px;
      color: var(--secondary);
    }

    aside.sidebar a {
      display: block;
      padding: 12px 16px;
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      border-radius: 8px;
      margin-bottom: 8px;
      transition: 0.2s;
    }

    aside.sidebar a:hover,
    aside.sidebar a.active {
      background: var(--secondary);
      color: var(--primary);
    }

    /* MAIN AREA */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
      border-bottom: 3px solid var(--secondary);
    }

    header strong {
      color: var(--primary);
      font-size: 1.1em;
    }

    header .top-controls button {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      background: var(--secondary);
      color: var(--primary);
      transition: 0.3s;
    }

    header .top-controls button:hover {
      background: var(--primary);
      color: white;
    }

    main {
      flex: 1;
      padding: 32px;
      max-width: 900px;
      margin: auto;
    }

    /* PROFILE CARD */
    .profile-container {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px;
      transition: 0.3s;
    }

    .profile-container:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 22px rgba(20, 60, 40, 0.2);
    }

    h1 {
      color: var(--primary);
      margin-bottom: 6px;
      text-align: center;
    }

    #role-label {
      background: var(--secondary);
      color: #fff;
      padding: 5px 15px;
      border-radius: 15px;
      display: inline-block;
      margin-top: 6px;
      font-weight: 600;
      text-align: center;
    }

    h2 {
      color: var(--primary);
      margin-top: 22px;
      margin-bottom: 10px;
      font-size: 1.2em;
    }

    .profile-details table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    .profile-details th {
      background: var(--accent);
      color: var(--primary);
    }

    .profile-details td {
      background: var(--surface);
      color: var(--text);
    }

    .profile-details th,
    .profile-details td {
      padding: 10px 14px;
      text-align: left;
    }

    .action-btn {
      padding: 10px 20px;
      background: var(--secondary);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .action-btn:hover {
      background: var(--primary);
    }

    form input,
    form textarea,
    form select {
      width: 100%;
      padding: 10px 12px;
      margin: 8px 0 15px;
      border: 1px solid var(--secondary);
      border-radius: 6px;
      background: var(--accent);
      font-size: 1em;
    }

    form label {
      font-weight: 600;
      color: var(--primary);
      display: block;
      margin-top: 8px;
    }

    .profile-image img {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid var(--secondary);
      box-shadow: var(--shadow);
    }

    .hidden {
      display: none;
    }

    @media (max-width: 900px) {
      aside.sidebar {
        width: 80px;
        padding: 12px;
      }

      aside.sidebar h2 {
        display: none;
      }

      main {
        padding: 20px;
      }

      .profile-container {
        padding: 22px;
      }
    }
  </style>

</head>

<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div>
      <h2>🌾 Green Fields</h2>
      <nav>
        <a href="consumers.html">Home</a>
        <a href="consumer-profile.html" class="active">Profile</a>
        <a href="orders.html">My Orders</a>
        <a href="buyers.html">Buy Products</a>
      </nav>
    </div>
    <div><small>&copy; 2025 Green Fields</small></div>
  </aside>

  <div class="main-area">
    <header>
      <div><strong>Profile Dashboard</strong></div>
      <div class="top-controls">
        <button onclick="window.location.href='login.html'">Logout</button>
      </div>
    </header>

    <main>
      <div class="profile-container">
        <header style="text-align:center;">
          <h1>Your Profile</h1>
          <p id="role-label">Role: <span id="profile-role">Not set</span></p>
        </header>

        <!-- Profile Form -->
        <section id="profile-form-section">
          <h2>Enter Your Details</h2>

          <div class="profile-image">
            <img id="preview-image" alt="Profile Image">
          </div>

          <form id="profile-form">
            <label>Upload Profile Image:</label>
            <input type="file" id="input-image" accept="image/*">

            <label>Name:</label>
            <input type="text" id="input-name" required>

            <label>Role:</label>
            <select id="input-role" required>
              <option value="">Select role</option>
              <option value="Farmer">Farmer</option>
              <option value="Buyer">Buyer</option>
              <option value="Both">Both</option>
            </select>

            <label>Location:</label>
            <input type="text" id="input-location">

            <label>Summary:</label>
            <textarea id="input-summary" rows="3"></textarea>

            <label>Products/Interests:</label>
            <input type="text" id="input-products">

            <label>Community/FPO:</label>
            <input type="text" id="input-fpo">

            <label>Certifications:</label>
            <input type="text" id="input-cert">

            <label>Preferred Payment:</label>
            <input type="text" id="input-payment">

            <label>Languages:</label>
            <input type="text" id="input-languages">

            <label>Contact:</label>
            <input type="email" id="input-contact">

            <button type="submit" class="action-btn">Save Profile</button>
          </form>
        </section>

        <!-- Profile Display -->
        <section id="profile-display-section" class="hidden">
          <div class="profile-image">
            <img id="display-image" src="default.png" alt="Profile Image">
          </div>

          <h2>Profile Summary</h2>
          <p id="display-summary"></p>

          <h2>Key Details</h2>
          <div class="profile-details">
            <table>
              <tr><th>Name</th><td id="display-name"></td></tr>
              <tr><th>Location</th><td id="display-location"></td></tr>
              <tr><th>Products/Interests</th><td id="display-products"></td></tr>
              <tr><th>Community/FPO</th><td id="display-fpo"></td></tr>
              <tr><th>Certifications</th><td id="display-cert"></td></tr>
              <tr><th>Preferred Payment</th><td id="display-payment"></td></tr>
              <tr><th>Languages</th><td id="display-languages"></td></tr>
              <tr><th>Contact</th><td id="display-contact"></td></tr>
            </table>
          </div>

          <div class="profile-actions">
            <button id="edit-profile" class="action-btn">Edit Profile</button>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script>
    const username = localStorage.getItem("loggedInUser");

    if (!username) {
      alert("Please log in first!");
      window.location.href = "login.html";
    }

    const profileForm = document.getElementById("profile-form");
    const formSection = document.getElementById("profile-form-section");
    const displaySection = document.getElementById("profile-display-section");
    const profileRole = document.getElementById("profile-role");
    const inputImage = document.getElementById("input-image");
    const previewImage = document.getElementById("preview-image");
    const displayImage = document.getElementById("display-image");

    inputImage.addEventListener("change", function () {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          previewImage.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    profileForm.addEventListener("submit", async function (e) {
      e.preventDefault();
      
      // Validate required fields
      const name = document.getElementById("input-name").value.trim();
      const role = document.getElementById("input-role").value.trim();
      const contact = document.getElementById("input-contact").value.trim();

      if (!name || !role || !contact) {
        alert("❌ Please fill in all required fields: Name, Role, and Contact");
        return;
      }

      const profileData = {
        username,
        name,
        role,
        location: document.getElementById("input-location").value.trim(),
        summary: document.getElementById("input-summary").value.trim(),
        products: document.getElementById("input-products").value.trim(),
        fpo: document.getElementById("input-fpo").value.trim(),
        cert: document.getElementById("input-cert").value.trim(),
        payment: document.getElementById("input-payment").value.trim(),
        languages: document.getElementById("input-languages").value.trim(),
        contact,
        image: previewImage.src || "default.png"
      };

      try {
        console.log("📤 Sending profile data:", profileData);
        
        const response = await fetch("/api/profile", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(profileData)
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const result = await response.json();
        console.log("📥 Server response:", result);

        if (result.success) {
          alert("✅ Profile saved to MongoDB successfully!");
          localStorage.setItem(`profile_${username}`, JSON.stringify(profileData));
          showProfile(profileData);
        } else {
          alert("❌ Error saving profile: " + (result.error || "Unknown error"));
        }
      } catch (error) {
        console.error("Error saving profile:", error);
        alert("❌ Error saving profile: " + error.message);
      }
    });

    window.addEventListener("DOMContentLoaded", async () => {
      // Try to load from database first
      try {
        const response = await fetch(`/api/profile/${username}`);
        if (response.ok) {
          const profile = await response.json();
          showProfile(profile);
          return;
        }
      } catch (error) {
        console.log("Profile not in database, checking localStorage...");
      }

      // Fallback to localStorage
      const savedProfile = localStorage.getItem(`profile_${username}`);
      if (savedProfile) {
        const profile = JSON.parse(savedProfile);
        showProfile(profile);
      }
    });

    function showProfile(profile) {
      document.getElementById("display-name").innerText = profile.name;
      document.getElementById("display-location").innerText = profile.location;
      document.getElementById("display-summary").innerText = profile.summary;
      document.getElementById("display-products").innerText = profile.products;
      document.getElementById("display-fpo").innerText = profile.fpo;
      document.getElementById("display-cert").innerText = profile.cert;
      document.getElementById("display-payment").innerText = profile.payment;
      document.getElementById("display-languages").innerText = profile.languages;
      document.getElementById("display-contact").innerText = profile.contact;
      displayImage.src = profile.image || "default.png";
      profileRole.innerText = profile.role;

      formSection.classList.add("hidden");
      displaySection.classList.remove("hidden");
    }

    document.getElementById("edit-profile").addEventListener("click", () => {
      formSection.classList.remove("hidden");
      displaySection.classList.add("hidden");
    });
  </script>

</body>
</html>
