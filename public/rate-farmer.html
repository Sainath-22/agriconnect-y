<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rate a Farmer | AgriConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(-45deg, #f9f5e3, #f6e3c5, #cdebb0, #f4f1ec);
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      padding: 40px;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      color: #6b4226;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #888;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      color: #6b4226;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      transition: 0.3s;
    }

    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #a3c14a;
      box-shadow: 0 0 8px rgba(163, 193, 74, 0.3);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    /* Star Rating */
    .star-rating {
      display: flex;
      gap: 10px;
      margin: 15px 0;
    }

    .star {
      font-size: 40px;
      cursor: pointer;
      transition: 0.2s;
      color: #ddd;
    }

    .star:hover,
    .star.active {
      color: #ffb347;
      transform: scale(1.1);
    }

    .rating-value {
      color: #6b4226;
      font-weight: 600;
      margin-left: 10px;
      font-size: 16px;
    }

    /* Category Tags */
    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    .category-tag {
      padding: 8px 16px;
      border: 2px solid #ddd;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.3s;
      font-size: 13px;
      background: white;
      color: #6b4226;
    }

    .category-tag:hover,
    .category-tag.selected {
      background: #a3c14a;
      border-color: #a3c14a;
      color: #2f2f1f;
    }

    /* Buttons */
    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 30px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      font-family: 'Poppins', sans-serif;
    }

    .btn-submit {
      background: #a3c14a;
      color: #2f2f1f;
    }

    .btn-submit:hover {
      background: #90b33d;
      transform: scale(1.02);
    }

    .btn-cancel {
      background: #e0e0e0;
      color: #333;
    }

    .btn-cancel:hover {
      background: #d0d0d0;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      display: none;
      font-weight: 600;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }

    .info-box {
      background: #e7f3ff;
      border-left: 4px solid #2196F3;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 4px;
      font-size: 13px;
      color: #0d47a1;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }

      h1 {
        font-size: 22px;
      }

      .star {
        font-size: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⭐ Rate a Farmer</h1>
    <p class="subtitle">Share your experience with other buyers</p>

    <div class="info-box">
      💡 Your honest feedback helps farmers improve and helps other buyers make informed decisions.
    </div>

    <form id="ratingForm">
      <!-- Farmer Selection -->
      <div class="form-group">
        <label for="farmerId">🌾 Farmer Name</label>
        <input type="text" id="farmerName" placeholder="Enter farmer username" required>
        <small style="color: #999; display: block; margin-top: 4px;">Type the username of the farmer you want to rate</small>
      </div>

      <!-- Product Name -->
      <div class="form-group">
        <label for="productName">📦 Product Name (Optional)</label>
        <input type="text" id="productName" placeholder="e.g., Fresh Tomatoes">
      </div>

      <!-- Star Rating -->
      <div class="form-group">
        <label>⭐ Your Rating</label>
        <div class="star-rating" id="starRating">
          <span class="star" data-value="1">★</span>
          <span class="star" data-value="2">★</span>
          <span class="star" data-value="3">★</span>
          <span class="star" data-value="4">★</span>
          <span class="star" data-value="5">★</span>
          <span class="rating-value" id="ratingValue">0/5</span>
        </div>
      </div>

      <!-- Categories -->
      <div class="form-group">
        <label>🏷️ What did you like? (Select all that apply)</label>
        <div class="categories">
          <div class="category-tag" data-category="Quality">Quality</div>
          <div class="category-tag" data-category="Delivery">Delivery</div>
          <div class="category-tag" data-category="Communication">Communication</div>
          <div class="category-tag" data-category="Value">Value for Money</div>
          <div class="category-tag" data-category="Packaging">Packaging</div>
        </div>
      </div>

      <!-- Review Text -->
      <div class="form-group">
        <label for="review">📝 Your Review (Optional)</label>
        <textarea id="review" placeholder="Share your detailed experience... (max 500 characters)" maxlength="500"></textarea>
        <small style="color: #999; display: block; margin-top: 4px;">
          <span id="charCount">0</span>/500 characters
        </small>
      </div>

      <!-- Buttons -->
      <div class="button-group">
        <button type="submit" class="btn-submit">✅ Submit Rating</button>
        <button type="reset" class="btn-cancel">Clear</button>
      </div>

      <div class="status" id="status"></div>
    </form>
  </div>

  <script>
    let selectedRating = 0;
    let selectedCategories = [];

    // Star rating interaction
    const stars = document.querySelectorAll(".star");
    const ratingValue = document.getElementById("ratingValue");

    stars.forEach(star => {
      star.addEventListener("click", () => {
        selectedRating = star.dataset.value;
        ratingValue.textContent = `${selectedRating}/5`;
        
        stars.forEach(s => s.classList.remove("active"));
        for (let i = 0; i < selectedRating; i++) {
          stars[i].classList.add("active");
        }
      });

      star.addEventListener("mouseover", () => {
        const hoverValue = star.dataset.value;
        stars.forEach((s, idx) => {
          s.classList.toggle("active", idx < hoverValue);
        });
        ratingValue.textContent = `${hoverValue}/5`;
      });
    });

    // Category selection
    const categoryTags = document.querySelectorAll(".category-tag");
    categoryTags.forEach(tag => {
      tag.addEventListener("click", () => {
        tag.classList.toggle("selected");
        const category = tag.dataset.category;
        
        if (selectedCategories.includes(category)) {
          selectedCategories = selectedCategories.filter(c => c !== category);
        } else {
          selectedCategories.push(category);
        }
      });
    });

    // Character count
    const review = document.getElementById("review");
    review.addEventListener("input", () => {
      document.getElementById("charCount").textContent = review.value.length;
    });

    // Form submission
    document.getElementById("ratingForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById("status");

      if (selectedRating === 0) {
        statusEl.className = "status error";
        statusEl.textContent = "❌ Please select a rating";
        return;
      }

      try {
        statusEl.className = "status";
        statusEl.textContent = "⏳ Submitting your rating...";

        // First, get farmer ID by username
        const farmerName = document.getElementById("farmerName").value.trim();
        const farmerRes = await fetch(`/api/user/by-username/${farmerName}`);
        const farmerData = await farmerRes.json();

        if (!farmerData || !farmerData._id) {
          throw new Error("Farmer not found");
        }

        const response = await fetch("/api/ratings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            farmerId: farmerData._id,
            rating: parseInt(selectedRating),
            review: document.getElementById("review").value,
            productName: document.getElementById("productName").value,
            categories: selectedCategories
          })
        });

        const result = await response.json();

        if (response.ok) {
          statusEl.className = "status success";
          statusEl.textContent = "✅ Rating submitted successfully! Thank you for your feedback.";
          document.getElementById("ratingForm").reset();
          selectedRating = 0;
          selectedCategories = [];
          stars.forEach(s => s.classList.remove("active"));
          ratingValue.textContent = "0/5";
          categoryTags.forEach(tag => tag.classList.remove("selected"));
          
          setTimeout(() => {
            statusEl.style.display = "none";
          }, 5000);
        } else {
          throw new Error(result.error || "Failed to submit rating");
        }
      } catch (err) {
        statusEl.className = "status error";
        statusEl.textContent = `❌ Error: ${err.message}`;
      }
    });
  </script>
</body>
</html>
